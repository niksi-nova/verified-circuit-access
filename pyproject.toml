[project]
name = "verified-circuit-access"
version = "0.1.0"
description = "Verified circuit diagram accessibility for blind students"
requires-python = ">=3.11,<3.12"
dependencies = [
    "networkx==3.6.1",
    "pillow==13.0.0",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/vca"]
