
[project]
name = "verified-circuit-access"
version = "0.1.0"
description = "Verified circuit diagram accessibility for blind students"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic==2.8.0",
    "networkx==3.6.1",
    "numpy==2.4.6",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "scipy==1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "ruff==0.17.4",
]

# M2 model training (local CPU or Kaggle/Colab GPU).
train = [
    "ultralytics==8.4.192",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "scikit-learn==1.9.1",
]
# Local analysis engine (FastAPI). Needs --extra train too (ultralytics,
# torch, scikit-learn/joblib) to actually run the pipeline and verifier.
api = [
    "fastapi>=0.162.5",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: real-weights integration tests (loads models, runs inference)"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vca"]
